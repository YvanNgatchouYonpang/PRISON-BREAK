<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>PRISON BREAK-Commentaires</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <!-- Navigation -->
    <div id="page">
        <header>
            <div id="conteneur">
                <!-- https://i.pinimg.com/736x/2f/90/7f/2f907f29fcf2111b3ea7a32d6e2cc407.jpg-->
                <a href="index.html">
                    <img src="img/img3.jpg" alt="logo prison break" title="prison break hand">
                </a>
            </div>
            <h1 id="haut">PRISON BREAK</h1>
        </header>
        <nav>
            <ul class="zone">
                <li><a href="index.html">Accueil</a></li>
                <li><a href="galerie-images.html">Galerie Photo</a></li>
                <li><a class="renforcer" href="commentaires.html">Commentaires</a></li>
            </ul>
            <div>
                <a href="connexion.html">Se connecter</a>
            </div>

        </nav>

        <!-- Formulaire de commentaires -->
        <main>
            <h2 class="gal">Commentaires</h2>
            <form action="mailto:tonadresse@example.com" method="post" enctype="text/plain">
                <div class="form-section">
                    <fieldset class="comment">
                        <!-- Nom et Prénom en deux colonnes -->
                        <div>
                            <div>
                                <label for="nom">Nom :</label>
                                <input type="text" id="nom" name="nom" required>
                            </div>
                            <div>
                                <label for="prenom">Prénom :</label>
                                <input type="text" id="prenom" name="prenom" required>
                            </div>
                        </div>

                        <!-- Courriel -->
                        <div>
                            <label for="courriel">Courriel :</label>
                            <input type="email" id="courriel" name="courriel" required>
                        </div>

                        <!-- Téléphone -->
                        <div>
                            <label for="telephone">Téléphone :</label>
                            <input type="tel" id="telephone" name="telephone" placeholder="###-###-####">
                        </div>

                        <!-- Province -->
                        <div>
                            <label for="province">Province :</label>
                            <select id="province" name="province">
                                <option>Alberta</option>
                                <option>Colombie-Britannique</option>
                                <option>Manitoba</option>
                                <option>Nouvelle-Écosse</option>
                                <option>Ontario</option>
                                <option selected>Québec</option>
                            </select>
                        </div>

                        <!-- Date de naissance -->
                        <div>
                            <label for="naissance">Date de naissance :</label>
                            <input type="date" id="naissance" name="naissance">
                        </div>

                        <!-- Zone de texte -->
                        <div>
                            <label for="commentaire">Commentaires :</label>
                            <textarea id="commentaire" name="commentaire" rows="7" cols="30"></textarea>
                        </div>
                    </fieldset>

                    <!-- Cases à cocher -->
                    <fieldset class="form-group">
                        <legend>Vos goûts cinématographiques :</legend>
                        <label><input type="checkbox" name="genre" value="Action"> Action</label>
                        <label><input type="checkbox" name="genre" value="Comédie"> Comédie</label>
                        <label><input type="checkbox" name="genre" value="Drame"> Drame</label>
                        <label><input type="checkbox" name="genre" value="Suspense"> Suspense</label>
                        <label><input type="checkbox" name="genre" value="Horreur"> Horreur</label>

                        <!-- Boutons radio -->
                        <legend>Notez notre site :</legend>
                        <label><input type="radio" name="note" value="Excellent" checked> Excellent</label>
                        <label><input type="radio" name="note" value="Très bien"> Très bien</label>
                        <label><input type="radio" name="note" value="Moyen"> Moyen</label>
                        <label><input type="radio" name="note" value="Bof"> Bof</label>
                    </fieldset>
                </div>

                <!-- Bouton d'envoi -->
                <div class="envoi">
                    <button type="submit">Envoyer les commentaires</button>
                </div>

            </form>
        </main>
        <footer class="bas">
            <p><a href="#haut">Haut de la page</a></p>
            <p>Copyright 2021</p>
            <p></p>
            <P>420-W11-SF</P>
            <P>Travail Pratique 1</P>
            <p>Yvan Ngantchou Yonpang</p>
        </footer>
    </div>
</body>

</html>
